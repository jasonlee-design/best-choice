<style>

  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --amber:#f0b240; --amber-soft:#3d2f0f;
  --good:#4cc38a; --good-soft:#143a28; --bad:#ff8173; --bad-soft:#40201c; --warn:#f0b240; --warn-soft:#3b2e0f;
  --l1:#6f9cf2; --l2:#f08a5d; --l3:#b58af0; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1a20; --surface:#15262e; --ink:#e5eef2; --ink2:#9bb0bb; --line:#2a3f4b; --grid:#1c303a;
  --accent:#38c4b9; --accent-ink:#06221f; --accent-soft:#12403d;
  --amber:#f0b240; --amber-soft:#3d2f0f;
  --good:#4cc38a; --good-soft:#143a28; --bad:#ff8173; --bad-soft:#40201c; --warn:#f0b240; --warn-soft:#3b2e0f;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .letter{color:#2a1c00}}

/* 教師畫面 */

.hist{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}

.pips i.d{background:var(--good)} .pips i.c{background:var(--accent)} .pips i.s{background:var(--bad)}

<script>
/* ===== ENGINE: 題目產生與驗證(純數學,不依賴畫面) ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ri(r,lo,hi){return lo+Math.floor(r()*(hi-lo+1));}
const EPS=1e-9;

/* 找出可行區域的所有頂點。lines 0:x=0  1:y=0  2..4:三個限制 */
function findCorners(rows){
  const L=[{a:1,b:0,c:0},{a:0,b:1,c:0}].concat(rows.map(r=>({a:r.a,b:r.b,c:r.c})));
  const feas=(x,y)=>x>=-EPS&&y>=-EPS&&rows.every(r=>{const v=r.a*x+r.b*y;return r.sign==='<='?v<=r.c+EPS:v>=r.c-EPS;});
  const pts=[];
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
    const d=L[i].a*L[j].b-L[j].a*L[i].b; if(Math.abs(d)<EPS)continue;
    const x=(L[i].c*L[j].b-L[j].c*L[i].b)/d, y=(L[i].a*L[j].c-L[j].a*L[i].c)/d;
    if(!feas(x,y))continue;
    if(pts.some(p=>Math.abs(p.x-x)<1e-7&&Math.abs(p.y-y)<1e-7))continue;
    pts.push({x,y});
  }
  pts.forEach(p=>{p.on=[];L.forEach((l,k)=>{if(Math.abs(l.a*p.x+l.b*p.y-l.c)<1e-7)p.on.push(k);});});
  return pts;
}
function orderCorners(pts){
  const cx=pts.reduce((s,p)=>s+p.x,0)/pts.length, cy=pts.reduce((s,p)=>s+p.y,0)/pts.length;
  const s=pts.slice().sort((p,q)=>Math.atan2(p.y-cy,p.x-cx)-Math.atan2(q.y-cy,q.x-cx));
  let k=0;for(let i=1;i<s.length;i++){if(s[i].x<s[k].x||(s[i].x===s[k].x&&s[i].y<s[k].y))k=i;}
  return s.slice(k).concat(s.slice(0,k));
}
function evalCorners(cs,p,q){return cs.map(c=>p*c.x+q*c.y);}
function uniqueBest(vals,mode){
  const best=mode==='max'?Math.max(...vals):Math.min(...vals);
  const idx=[];vals.forEach((v,i)=>{if(v===best)idx.push(i);});
  return idx.length===1?idx[0]:-1;
}
const isInt=v=>Math.abs(v-Math.round(v))<1e-7;
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}

/* 求最大值:先決定五個整數頂點,再反推三條限制線,保證頂點都是整數 */
function genMaxRows(r){
  const X=ri(r,8,36),x2=ri(r,2,X-1),y2=ri(r,1,14),x3=ri(r,1,x2-1),y3=ri(r,y2+1,y2+14),Y=ri(r,y3+1,y3+14);
  const E=[[x2-X,y2,X,0],[x3-x2,y3-y2,x2,y2],[-x3,Y-y3,x3,y3]];
  const s=E.map(e=>e[1]/-e[0]);
  if(!(s[0]>s[1]&&s[1]>s[2]))return null;
  const rows=E.map(e=>{const g=gcd(e[1],e[0]);const a=e[1]/g,b=-e[0]/g;return {a,b,c:a*e[2]+b*e[3],sign:'<='};});
  if(rows.some(w=>w.a>9||w.b>9||w.c>140))return null;
  for(let i=rows.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[rows[i],rows[j]]=[rows[j],rows[i]];}
  return rows;
}

/* 兩個限制的最大值題:三個整數頂點 (X,0) (x2,y2) (0,Y) 反推兩條線 */
function genMaxRows2(r){
  const X=ri(r,8,36),x2=ri(r,2,X-1),y2=ri(r,2,20),Y=ri(r,y2+1,y2+16);
  const E=[[x2-X,y2,X,0],[-x2,Y-y2,x2,y2]];
  if(!(E[0][1]/-E[0][0]>E[1][1]/-E[1][0]))return null;
  const rows=E.map(e=>{const g=gcd(e[1],e[0]);const a=e[1]/g,b=-e[0]/g;return {a,b,c:a*e[2]+b*e[3],sign:'<='};});
  if(rows.some(w=>w.a>9||w.b>9||w.c>140))return null;
  if(r()<.5)rows.reverse();
  return rows;
}

/* 產生一題:成功回傳 problem,失敗回傳 null。nc = 限制個數(2 或 3) */
function buildProblem(mode,seed,scale,nc){
  nc=nc===2?2:3;
  const r=mulberry32(seed>>>0);
  for(let t=0;t<40000;t++){
    const rows=[];
    if(mode==='max'){
      const g=nc===2?genMaxRows2(r):genMaxRows(r); if(!g)continue; g.forEach(w=>rows.push(w));
    }else{
      rows.push({a:ri(r,1,6),b:ri(r,1,6),c:ri(r,10,60),sign:'>='});
      if(nc===3)rows.push({a:ri(r,1,6),b:ri(r,1,6),c:ri(r,10,60),sign:'>='});
      rows.push({a:ri(r,1,5),b:ri(r,1,5),c:ri(r,30,100),sign:'<='});
    }
    let par=false;
    for(let i=0;i<nc;i++)for(let j=i+1;j<nc;j++)if(rows[i].a*rows[j].b===rows[j].a*rows[i].b)par=true;
    if(par)continue;
    const cs=findCorners(rows);
    if(cs.length<4||cs.length>(nc===2?4:5))continue;
    if(!cs.every(c=>isInt(c.x)&&isInt(c.y)))continue;
    if(Math.max(...cs.map(c=>Math.max(c.x,c.y)))>45)continue;
    if(Math.max(...cs.map(c=>Math.max(c.x,c.y)))<8)continue;
    let ok=true;
    for(let i=0;i<nc;i++){if(cs.filter(c=>c.on.includes(i+2)).length<2)ok=false;}
    if(!ok)continue;
    const p=ri(r,1,9),q=ri(r,1,9);
    const cs2=orderCorners(cs.map(c=>({x:Math.round(c.x),y:Math.round(c.y),on:c.on})));
    const vals=evalCorners(cs2,p,q);
    const bi=uniqueBest(vals,mode); if(bi<0)continue;
    const bc=cs2[bi];
    if(bc.on.filter(k=>k>=2).length<(nc===3?2:1))continue;       // 最佳點要靠解聯立方程式才找得到
    if(mode==='max'&&bc.x===0&&bc.y===0)continue;
    // 變動題:改一下係數,最佳點要換位置
    let alt=null,altCost=99;
    for(let p2=1;p2<=9;p2++)for(let q2=1;q2<=9;q2++){
      if(p2===p&&q2===q)continue;
      const v2=evalCorners(cs2,p2,q2);const b2=uniqueBest(v2,mode);
      if(b2<0||b2===bi)continue;
      const cost=Math.abs(p2-p)+Math.abs(q2-q)+(p2!==p&&q2!==q?2:0);
      if(cost<altCost){altCost=cost;alt={p:p2,q:q2,best:b2,vals:v2};}
    }
    if(!alt||altCost>6)continue;
    const k=scale||1;
    return {mode,seed,nc,rows,p:p*k,q:q*k,corners:cs2,vals:vals.map(v=>v*k),best:bi,
      alt:{p:alt.p*k,q:alt.q*k,best:alt.best,vals:alt.vals.map(v=>v*k)}};
  }
  return null;
}

/* 輸入解析:接受 12、12.5、25/3、全形數字 */
function parseNum(s){
  if(s==null)return NaN;
  s=String(s).trim().replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248)).replace(/．/g,'.').replace(/／/g,'/').replace(/[－−]/g,'-');
  if(s==='')return NaN;
  let m=s.match(/^-?\d+(\.\d+)?$/);if(m)return Number(s);
  m=s.match(/^(-?\d+)\s*\/\s*(\d+)$/);if(m&&Number(m[2])!==0)return Number(m[1])/Number(m[2]);
  return NaN;
}

function niceMax(v){const st=[1,2,5,10,20,50].find(s=>v/s<=9)||50;return {max:Math.ceil(v/st)*st,step:st};}
function clipLine(a,b,c,xm,ym){
  const pts=[];const add=(x,y)=>{if(x>=-1e-6&&x<=xm+1e-6&&y>=-1e-6&&y<=ym+1e-6&&!pts.some(p=>Math.abs(p[0]-x)<1e-6&&Math.abs(p[1]-y)<1e-6))pts.push([x,y]);};
  if(b){add(0,c/b);add(xm,(c-a*xm)/b);} if(a){add(c/a,0);add((c-b*ym)/a,ym);}
  return pts.length>=2?[pts[0],pts[1]]:null;
}

function foundCorners(){const P=S.prob,I=S.inputs;const used=new Set();const n=+I.n4||0;
  for(let k=0;k<n;k++){const x=parseNum(I['c'+k+'x']),y=parseNum(I['c'+k+'y']);const j=P.corners.findIndex((c,jj)=>!used.has(jj)&&Math.abs(c.x-x)<1e-6&&Math.abs(c.y-y)<1e-6);if(j>=0)used.add(j);}return used;}
function firstBadRow(){const P=S.prob,I=S.inputs;return P.rows.findIndex((r,i)=>!(parseNum(I['r'+i+'a'])===r.a&&parseNum(I['r'+i+'b'])===r.b&&parseNum(I['r'+i+'c'])===r.c&&I['r'+i+'s']===r.sign));}
function firstBadRow3(){const P=S.prob,I=S.inputs;return P.rows.findIndex((r,i)=>!(Math.abs(parseNum(I['t'+i+'x'])-r.c/r.a)<=0.06&&Math.abs(parseNum(I['t'+i+'y'])-r.c/r.b)<=0.06));}

function doCheck(){
  const st=S.step,def=STEP[st];const r=def.check();
  if(r.ok){
    S.done[st-1]=true;S.msg[st]=null;S.flash=`第 ${st} 步通過了`;
    if(st<6){S.step=st+1;S.stepStart=Date.now();}
    else{S.msg[6]={type:'good',text:'答對了！'};}
    schedulePush();
  }else{S.errs[st-1]++;S.msg[st]={type:'bad',text:r.text};S.flash='';schedulePush();}
  render(true);
}
function doHint(){
  const st=S.step,def=STEP[st];const l=Math.min(3,S.hints[st-1]+1);S.hints[st-1]=l;
  if(l===3){def.fill();S.marks={};S.msg[st]={type:'hint',text:'答案已經填進去了，請看一看每一格是怎麼來的，再按「檢查」。'};}
  else S.msg[st]={type:'hint',text:def.hint(l)};
  schedulePush();render(true);
}
function finishProblem(){S.finished=true;S.solved++;schedulePush();render();}

  <div class="card stack"><div><h2>1　選一個你有興趣的主題</h2><div class="themes" role="radiogroup" aria-label="主題">${THEMES.map(t=>`<button class="theme" role="radio" aria-checked="${t.id===S.themeId}" data-act="theme" data-arg="${t.id}"><b>${esc(t.name)}</b><span>${esc(t.tag)}</span></button>`).join('')}</div></div>
  <div><h2>2　你想求最大值還是最小值？</h2><div class="seg" role="radiogroup" aria-label="題型"><button role="radio" aria-checked="${mode==='max'}" data-act="mode" data-arg="max">最大值</button><button role="radio" aria-checked="${mode==='min'}" data-act="mode" data-arg="min">最小值</button></div>
  <p class="small muted" style="margin:6px 0 0">${mode==='max'?'資源有限，想拿到最多。例如：時間不夠，想賺最多。':'目標一定要達到，想花最少。例如：至少要賺到多少，想花最少時間。'}</p></div>
  <div><h2>限制條件有幾個？</h2><div class="seg" role="radiogroup" aria-label="限制個數"><button role="radio" aria-checked="${S.nc===2}" data-act="nc" data-arg="2">2 個</button><button role="radio" aria-checked="${S.nc===3}" data-act="nc" data-arg="3">3 個</button></div>
  <p class="small muted" style="margin:6px 0 0">${S.nc===2?'2 個限制：區域是 4 個角的四邊形，比較簡單，適合先暖身。':'3 個限制：區域最多 5 個角，段考常見，要多解一次聯立方程式。'}</p></div>
  <div><h2>3　在這個主題裡，你最在乎的是什麼？</h2><div class="chips" role="radiogroup" aria-label="最在乎的事">${list.map((c,i)=>`<button class="chip" role="radio" aria-checked="${!S.custom.trim()&&S.careIdx%3===i}" data-act="care" data-arg="${i}">${esc(c[0])}</button>`).join('')}</div>
  <label class="f" style="margin-top:10px;max-width:330px">或者自己寫一個（10 字以內）<input type="text" id="f-custom" data-id="custom" value="${esc(S.custom)}" maxlength="10" placeholder="例如：開心程度" style="font-family:var(--font)"></label></div>
  <div><h2>4　你是誰？</h2><div class="row"><label class="f">座號<input type="text" inputmode="numeric" id="f-seat" data-id="seat" value="${esc(S.seat)}" maxlength="2" style="width:5em"></label>
  <label class="f">暱稱（可不填）<input type="text" id="f-nick" data-id="nick" value="${esc(S.nick)}" maxlength="8" style="width:9em;font-family:var(--font)"></label></div>
  <p class="small muted" style="margin:6px 0 0">只用座號和暱稱，請不要輸入全名或班級以外的個資。</p></div>
  ${S.setupMsg?`<div class="msg">${esc(S.setupMsg)}</div>`:''}
  <div class="acts"><button class="btn" data-act="start">出題</button></div></div></div>`;
}
function studentHTML(){
  if(!S.prob||S.setup)return setupHTML();
  const P=S.prob;
  const left=`<div class="stack">${problemCard()}${stepsHTML()}${S.done[5]?finishHTML():''}</div>`;
  const code=makeCode();
  const right=`<div class="sticky stack"><div class="card"><h2>你的圖</h2>${graphHTML()}</div>
  <div class="card"><h2>回報給老師</h2><p class="small muted" style="margin:0 0 8px">老師要看你做到哪裡時，把下面這串進度碼複製，貼到老師指定的表單或群組。</p>
  <div class="row"><input type="text" id="f-mycode" readonly value="${esc(code)}" style="flex:1;min-width:12em" aria-label="進度碼" onclick="this.select()"><button class="btn" data-act="copycode">複製</button></div>
  <p class="small" id="copynote" style="margin:6px 0 0;min-height:1.4em"></p>${FORM_URL?`<a class="btn ghost" style="display:inline-block;text-decoration:none;margin-top:4px" href="${esc(FORM_URL)}" target="_blank" rel="noopener">開啟回報表單</a>`:''}</div></div>`;
  return `<div class="layout two">${left}${right}</div><div class="row" style="margin-top:14px"><button class="btn quiet" data-act="setup">換題目 / 換主題</button></div>`;
}

/* ===== 教師畫面 ===== */
let RECS=[],DEMO=false,teacherSubbed=false,teacherLoadNote='',onlyStuck=false,resetArm=false;
function startTeacherSub(){
  if(teacherSubbed||!DB)return;teacherSubbed=true;let got=false;
  const timer=setTimeout(()=>{if(!got){teacherLoadNote='還沒收到資料。可能網路較慢，或是沒有學生連上。';render();}},10000);
  try{DB.collection('progress').onSnapshot(snap=>{got=true;clearTimeout(timer);teacherLoadNote='';
    if(!DEMO&&!PASTED){RECS=snap.docs.map(d=>Object.assign({id:d.id},d.data()));}render();},
    err=>{got=true;clearTimeout(timer);teacherLoadNote='讀取失敗（'+(err&&err.code||'未知')+'）。';render();});}catch(e){teacherLoadNote='無法連上資料庫。';}
}
function stuckInfo(r,now){
  if(r.step>=7)return null;const i=Math.max(0,Math.min(5,(r.step||1)-1));const why=[];
  if((r.errs&&r.errs[i]||0)>=3)why.push('這步錯了 '+r.errs[i]+' 次');
  if((r.hints&&r.hints[i]||0)>=2)why.push('提示用到第 '+r.hints[i]+' 級');
  if(r.stepStart&&now-r.stepStart>300000)why.push('停在這步超過 '+Math.floor((now-r.stepStart)/60000)+' 分鐘');
  return why.length?why:null;
}
const ago=ms=>ms<45000?'剛剛':ms<3600000?Math.floor(ms/60000)+' 分鐘前':'很久以前';
function demoData(){
  const now=Date.now(),names=['','小安','','阿凱','','','小雨','','阿宏','','','','小琪','','',''],ths=['fair','game','stream','job','study','code','video','shop'];
  const out=[];
  for(let s=1;s<=16;s++){
    const r=Math.random();let step=1+Math.floor(Math.random()*6);if(r>0.82)step=7;
    const errs=[0,0,0,0,0,0].map((_,i)=>i<step-1?Math.floor(Math.random()*3):0);
    const stuckNow=step<7&&Math.random()<.22;
    if(stuckNow){errs[step-1]=3+Math.floor(Math.random()*2);}
    const hints=[0,0,0,0,0,0].map((_,i)=>(stuckNow&&i===step-1&&Math.random()<.5)?2:0);
    out.push({id:'demo'+s,seat:s,nick:names[s-1],theme:ths[s%ths.length],mode:Math.random()<.6?'max':'min',no:1,step,errs,hints,solved:step===7?1:0,stepStart:now-Math.floor(Math.random()*(stuckNow?400000:200000)),t:now-Math.floor(Math.random()*90000)});
  }
  return out;
}
function teacherHTML(){
  const now=Date.now(),recs=RECS.filter(r=>r.seat).sort((a,b)=>a.seat-b.seat);
  const stuck=recs.filter(r=>stuckInfo(r,now));const fin=recs.filter(r=>r.step>=7||r.solved>0);
  const cnt=[1,2,3,4,5,6].map(i=>recs.filter(r=>r.step===i).length);
  const errSum=[0,1,2,3,4,5].map(i=>recs.reduce((s,r)=>s+((r.errs&&r.errs[i])||0),0));
  const maxCnt=Math.max(1,...cnt),maxErr=Math.max(...errSum);
  const shown=onlyStuck?stuck:recs;
  let h=`<div class="stack">`;
  if(DEMO)h+=`<div class="banner"><b>這是示範資料</b>，不是真的學生。用來預覽老師畫面長什麼樣子。<button class="navlink" data-act="demooff">關掉示範</button></div>`;
  else if(LINK!=='on'&&!PASTED)h+=`<div class="banner">${LINK==='pending'?'正在連線…':'目前沒有即時連線。請把學生傳來的進度碼貼在下面的方框，再按「載入進度碼」。'}</div>`;
  if(!DEMO)h+=`<div class="card"><h2>貼上學生的進度碼</h2><p class="small muted" style="margin:0 0 8px">從 Google 表單的回覆試算表，把那一欄整欄複製貼上就可以，一行一個碼。同一個座號會以最新的一筆為準。</p>
  <textarea id="f-codes" data-id="codes" placeholder="LP.7.小安.fair.M.4.010000.000000.0.2.xxxxxx" style="font-family:var(--mono);font-size:13px">${esc(S.inputs.codes||'')}</textarea>
  <div class="acts" style="margin-top:8px"><button class="btn" data-act="loadcodes">載入進度碼</button></div>${pasteNote?`<p class="small" style="margin:6px 0 0">${esc(pasteNote)}</p>`:''}</div>`;
  if(teacherLoadNote)h+=`<div class="banner">${esc(teacherLoadNote)}</div>`;
  h+=`<div class="tiles"><div class="tile"><div class="n">${recs.length}</div><div class="l">已連上的學生</div></div>
  <div class="tile${stuck.length?' alert':''}"><div class="n">${stuck.length}</div><div class="l">卡關中（錯 3 次、用到提示 2 級以上，或同一步超過 5 分鐘）</div></div>
  <div class="tile"><div class="n">${fin.length}</div><div class="l">至少完成一題</div></div></div>
  <div class="card"><h2>大家現在在第幾步</h2><div class="hist">${cnt.map((n,i)=>`<div class="col"><span class="cnt">${n}</span><div class="barwrap"><div class="bar${n===maxCnt&&n>2?' hot':''}" style="height:${Math.max(2,Math.round(n/maxCnt*80))}px"></div></div><span class="lab">${i+1}<br>${STEPS[i]}</span></div>`).join('')}</div>
  <p class="small muted" style="margin:10px 0 0">全班累計出錯最多的是：${maxErr?'<b>第 '+(errSum.indexOf(maxErr)+1)+' 步「'+STEPS[errSum.indexOf(maxErr)]+'」（'+maxErr+' 次）</b>，可以全班一起複習這一步。':'目前還沒有人出錯。'}</p></div>
  <div class="row"><button class="btn ${onlyStuck?'':'ghost'}" data-act="onlystuck">${onlyStuck?'顯示全部學生':'只看卡關的學生'}</button>
  ${recs.length||DEMO?'':'<button class="btn quiet" data-act="demo">載入示範資料</button>'}
  ${IS_ADMIN&&!DEMO&&recs.length?`<button class="btn quiet" data-act="reset">${resetArm?'再按一次，清除全班進度':'清除全班進度'}</button>`:''}</div>`;
  if(!shown.length)h+=`<div class="empty">${recs.length?'目前沒有人卡關。':'學生開始作答後，座號會出現在這裡。<br>先按上面的「載入示範資料」可以預覽。'}</div>`;
  else h+=`<div class="board">${shown.map(r=>{
    const why=stuckInfo(r,now),fin=r.step>=7,th=THEMES.find(t=>t.id===r.theme);
    const pips=[1,2,3,4,5,6].map(i=>`<i class="${fin||i<r.step?'d':i===r.step?(why?'s':'c'):''}"></i>`).join('');
    const errTot=(r.errs||[]).reduce((a,b)=>a+b,0);
    return `<div class="stu${why?' stuck':''}${fin?' finished':''}"><div class="hd"><span class="seat">${esc(r.seat)}</span><span class="nick">${esc(r.nick||'')}</span><span class="tm">${ago(now-(r.t||now))}</span></div>
    <div class="pips" aria-label="進度">${pips}</div>
    <div class="why">${fin?'這題完成了':why?'卡在第 '+r.step+' 步：'+esc(why.join('，')):'第 '+r.step+' 步 '+STEPS[r.step-1]}</div>
    <div class="meta">${th?esc(th.name):''}・求${r.mode==='max'?'最大':'最小'}值・累計錯 ${errTot} 次・完成 ${r.solved||0} 題</div></div>`;}).join('')}</div>`;
  return h+'</div>';
}

/* ===== 總畫面 ===== */
function render(scroll){
  const app=document.getElementById('app');
  const teacher=S.view==='teacher';
  const link=LINK==='on'?'<span class="pill on"><i></i>已連線，老師看得到進度</span>':LINK==='ro'?'<span class="pill off"><i></i>只能練習（無法回報給老師）</span>':LINK==='pending'?'<span class="pill"><i></i>連線中</span>':'<span class="pill off"><i></i>單機練習中</span>';
  const head=`<header class="top"><div class="brand"><b>最佳選擇練習場</b><span>線性規劃 × 我最在乎的事</span></div>${teacher?'':link}${S.seat&&!teacher?`<span class="pill">座號 ${esc(S.seat)}</span>`:''}<button class="navlink" data-act="${teacher?'tostudent':'toteacher'}">${teacher?'回學生畫面':'老師畫面'}</button></header>`;
  const ae=document.activeElement,keepId=ae&&ae.dataset&&ae.dataset.id,keepPos=ae&&ae.selectionStart;
  app.innerHTML=head+(teacher?teacherHTML():studentHTML());
  if(keepId){const el=document.getElementById('f-'+keepId);if(el&&(el.tagName==='TEXTAREA'||el.type==='text')&&!scroll){el.focus();try{el.setSelectionRange(keepPos,keepPos);}catch(e){}}}
  if(scroll&&!teacher){const el=document.getElementById('step-'+S.step);if(el&&el.scrollIntoView)requestAnimationFrame(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'}));}
}
function route(){S.view=(location.hash==='#teacher')?'teacher':'student';if(S.view==='teacher')startTeacherSub();render();}
window.addEventListener('hashchange',route);

document.addEventListener('input',e=>{
  const id=e.target.dataset&&e.target.dataset.id;if(!id)return;
  S.inputs[id]=e.target.value;
  if(id==='seat'){S.seat=e.target.value.replace(/\D/g,'').slice(0,2);store.set('lp.seat',S.seat);}
  if(id==='nick'){S.nick=e.target.value.slice(0,8);store.set('lp.nick',S.nick);}
  if(id==='custom'){S.custom=e.target.value;store.set('lp.custom',S.custom);const chips=document.querySelectorAll('.chip');chips.forEach((c,i)=>c.setAttribute('aria-checked',String(!S.custom.trim()&&S.careIdx%3===i)));}
  if(S.marks[id]!==undefined){delete S.marks[id];e.target.classList.remove('ok','bad');}
});
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.id;if(!id)return;
  if(id==='n4'){render();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.id&&e.target.tagName==='INPUT'&&S.prob&&!S.setup&&S.view==='student'&&!(S.done[5])){e.preventDefault();doCheck();}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,arg=b.dataset.arg;
  if(a==='theme'){S.themeId=arg;store.set('lp.theme',arg);render();}
  else if(a==='mode'){S.mode=arg;store.set('lp.mode',arg);render();}
  else if(a==='nc'){S.nc=+arg;store.set('lp.nc',arg);render();}
  else if(a==='care'){S.careIdx=+arg;S.custom='';store.set('lp.care',arg);store.set('lp.custom','');render();}
  else if(a==='start'){
    if(!S.seat){S.setupMsg='請先填座號，老師才看得到你的進度。';render();return;}
    S.setupMsg='';S.setup=false;store.set('lp.seat',S.seat);makeProblem();}
  else if(a==='check')doCheck();
  else if(a==='hint')doHint();
  else if(a==='wi')wiCheck();
  else if(a==='finish')finishProblem();
  else if(a==='again'){S.setup=false;makeProblem();}
  else if(a==='flip'){S.mode=S.mode==='max'?'min':'max';store.set('lp.mode',S.mode);S.setup=false;makeProblem();}
  else if(a==='setup'){S.setup=true;render();}
  else if(a==='toteacher'){location.hash='teacher';}
  else if(a==='tostudent'){location.hash='';history.replaceState(null,'',location.pathname+location.search);route();}
  else if(a==='demo'){DEMO=true;RECS=demoData();render();}
  else if(a==='demooff'){DEMO=false;RECS=[];render();}
  else if(a==='loadcodes'){const r=parseCodes(S.inputs.codes);PASTED=true;DEMO=false;RECS=r.recs;pasteNote=r.n?`讀到 ${r.recs.length} 位學生${r.bad?`，有 ${r.bad} 個碼格式不對，已略過`:''}。`:'沒有找到進度碼（要以 LP. 開頭）。';render();}
  else if(a==='copycode'){const c=makeCode();const note=document.getElementById('copynote');
    const done=ok=>{if(note)note.textContent=ok?'已複製，貼到老師指定的地方。':'沒辦法自動複製，請點一下上面的方框，全選後手動複製。';};
    try{navigator.clipboard.writeText(c).then(()=>done(true),()=>{const i=document.getElementById('f-mycode');if(i)i.select();done(false);});}catch(e){const i=document.getElementById('f-mycode');if(i)i.select();done(false);}}
  else if(a==='onlystuck'){onlyStuck=!onlyStuck;render();}
  else if(a==='reset'){
    if(!resetArm){resetArm=true;render();setTimeout(()=>{resetArm=false;render();},4000);return;}
    resetArm=false;Promise.all(RECS.map(r=>DB.doc('progress/'+r.id).delete().catch(()=>{}))).then(()=>render());}
});
setInterval(()=>{if(S.view==='teacher')render();},20000);
route();initCaps();
</script>

</body></html>
